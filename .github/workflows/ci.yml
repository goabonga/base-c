name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install the toolchain
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: clang-format
        shell: bash
        run: make format-check 2>&1 | tee lint.txt
      - name: clang-tidy
        shell: bash
        run: make lint 2>&1 | tee -a lint.txt
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/summary.sh "lint (clang-format, clang-tidy)" "$JOB_STATUS" --file lint.txt

  build:
    name: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install the toolchain
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build with gcc and clang
        shell: bash
        run: |
          for cc in gcc clang; do
            echo "== ${cc}"
            make clean
            make CC="$cc"
            ./build/base-c --version
            ./build/base-c Arch
          done 2>&1 | tee build.txt
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/summary.sh "build on Arch Linux (gcc, clang)" "$JOB_STATUS" --file build.txt

  test:
    name: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install the toolchain
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Unit tests with gcc and clang (ASan, UBSan)
        shell: bash
        run: |
          for cc in gcc clang; do
            echo "== ${cc}"
            make clean
            make test CC="$cc"
          done 2>&1 | tee test.txt
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/summary.sh "tests on Arch Linux (gcc, clang)" "$JOB_STATUS" --file test.txt

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: actionlint
        shell: bash
        run: uvx --from actionlint-py actionlint 2>&1 | tee workflows.txt
      - name: zizmor
        shell: bash
        run: uvx zizmor --no-progress --offline .github/workflows 2>&1 | tee -a workflows.txt
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/summary.sh "workflows (actionlint, zizmor)" "$JOB_STATUS" --file workflows.txt

  multicz:
    name: multicz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # NOTE: no python-version pin - multicz needs Python >=3.12.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Validate multicz config
        shell: bash
        run: uv tool run multicz validate --strict 2>&1 | tee multicz.txt
      - name: Release plan
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/summary.sh "multicz" "$JOB_STATUS" --file multicz.txt
